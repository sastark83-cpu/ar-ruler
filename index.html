<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AR-рулетка</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14171c; color: #eef1f5; font: 16px/1.4 system-ui, sans-serif; }
  #ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  #start { margin: auto; padding: 20px; max-width: 460px; text-align: center; }
  #start h1 { margin: 0 0 8px; font-size: 24px; }
  #start p { color: #a9b2bf; margin: 6px 0; font-size: 14px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; background: #2d7ff9; color: #fff; }
  button.sec { background: #2b313b; }
  button.big { padding: 16px 28px; font-size: 18px; }
  button.active { background: #19a974; }
  #hud { display: none; }
  #top { padding: 10px; background: rgba(10,12,16,.72); }
  #live { font-size: 22px; font-weight: 600; }
  #info { font-size: 13px; color: #cfd6e0; white-space: pre-line; max-height: 28vh; overflow: auto; }
  #bottom { padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: rgba(10,12,16,.72); }
  #bottom button { flex: 1 1 28%; }
  #put { flex: 1 1 100% !important; padding: 18px; font-size: 20px; background: #f59e0b; color: #111; }
  #result { display: none; padding: 12px; overflow: auto; flex: 1; min-height: 0; }
  #plan { width: 100%; height: 52vh; display: block; border-radius: 12px; background: #0f1217; touch-action: none; }
  .padgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; background: rgba(10,12,16,.72); }
  .padgrid button { padding: 12px 4px; background: #3a4352; touch-action: manipulation; user-select: none; }
  .padgrid button.sec { background: #2b313b; font-size: 14px; }
  textarea { width: 100%; height: 160px; background: #0c0e12; color: #cfe; border: 1px solid #333; border-radius: 8px; font: 12px monospace; }
  label { font-size: 14px; color: #a9b2bf; }
  input[type=number] { width: 110px; padding: 8px; border-radius: 8px; border: 1px solid #333; background: #0c0e12; color: #fff; font: inherit; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 10px 0; }
  #err { color: #ff8a8a; font-size: 14px; }
</style>
</head>
<body>
<div id="ui">
  <div id="start">
    <h1>AR-рулетка</h1>
    <p>Тест точности на ARCore. Нужен Chrome на Android, свет и поверхности с фактурой.</p>
    <div class="row">
      <label>Поправочный коэффициент <input type="number" id="scale" step="0.001" value="1"></label>
    </div>
    <button class="big" id="go">Запустить AR</button>
    <p id="err"></p>
  </div>

  <div id="hud">
    <div id="top">
      <div id="live">Наведи на поверхность</div>
      <div id="info"></div>
    </div>
  </div>

  <div id="hud2" style="display:none">
    <div id="pad" class="padgrid" style="display:none">
      <button data-d="up">⤒ вверх</button><button data-d="fwd">▲ вперёд</button><button data-d="down">⤓ вниз</button>
      <button data-d="left">◀</button><button id="step" class="sec">шаг 10 мм</button><button data-d="right">▶</button>
      <button id="prevPt" class="sec">‹ точка</button><button data-d="back">▼ назад</button><button id="nextPt" class="sec">точка ›</button>
    </div>
    <div id="bottom">
      <button id="put">＋ Поставить точку</button>
      <button class="sec" id="nudge">Подстройка</button>
      <button class="sec active" id="mDist">Длина</button>
      <button class="sec" id="mRoom">Комната</button>
      <button class="sec" id="undo">Отмена</button>
      <button class="sec" id="close">Замкнуть</button>
      <button class="sec" id="reset">Сброс</button>
      <button class="sec" id="exit">Выход</button>
    </div>
  </div>

  <div id="result">
    <h2 style="margin:0 0 8px">План (вид сверху)</h2>
    <canvas id="plan"></canvas>
    <div class="row">
      <button class="sec" id="zin">＋</button>
      <button class="sec" id="zout">－</button>
      <button class="sec" id="zfit">По размеру</button>
      <button class="sec" id="dxf">Скачать DXF</button>
    </div>
    <div id="resText" style="white-space:pre-line"></div>
    <p><label>JSON (точки в мм)</label></p>
    <textarea id="json" readonly></textarea>
    <div class="row">
      <button class="big" id="again">Измерять дальше</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const ui = $('ui');

// ---------- состояние ----------
let mode = 'dist';      // dist | room
let pts = [];           // THREE.Vector3 (метры, система координат сессии)
let closed = false;
let scaleK = parseFloat(localStorage.getItem('scaleK') || '1') || 1;
$('scale').value = scaleK;
$('scale').addEventListener('change', () => {
  scaleK = parseFloat($('scale').value) || 1;
  localStorage.setItem('scaleK', scaleK);
});

// ---------- three ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 30);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.domElement.style.cssText = 'position:fixed;inset:0;z-index:-1';
document.body.appendChild(renderer.domElement);

const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.035, 0.05, 32).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xf59e0b })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

const group = new THREE.Group();
scene.add(group);

const liveGeom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const liveLine = new THREE.Line(liveGeom, new THREE.LineBasicMaterial({ color: 0xffffff }));
liveLine.frustumCulled = false;
liveLine.visible = false;
scene.add(liveLine);

const sphereGeom = new THREE.SphereGeometry(0.012, 16, 12);
const sphereMat = new THREE.MeshBasicMaterial({ color: 0x19a974 });
const selMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
const lineMat = new THREE.LineBasicMaterial({ color: 0x2d7ff9 });
let sel = -1;           // индекс выбранной точки для подстройки
let stepMm = 10;

// ---------- WebXR ----------
let session = null, hitSource = null, hitRequested = false;
const hitPos = new THREE.Vector3();

async function start() {
  $('err').textContent = '';
  if (!navigator.xr) { $('err').textContent = 'WebXR недоступен. Нужен Chrome на Android и HTTPS.'; return; }
  const ok = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  if (!ok) { $('err').textContent = 'immersive-ar не поддерживается (нет ARCore / «Службы Google Play для AR»?).'; return; }
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay', 'local-floor'],
      domOverlay: { root: ui }
    });
  } catch (e) { $('err').textContent = 'Не удалось запустить: ' + e.message; return; }
  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  hitRequested = false; hitSource = null;
  session.addEventListener('end', onEnd);
  $('start').style.display = 'none';
  $('result').style.display = 'none';
  $('hud').style.display = 'block';
  $('hud2').style.display = 'block';
  ui.style.background = 'transparent';
  document.body.style.background = 'transparent';
  update();
}

function onEnd() {
  session = null; hitSource = null; hitRequested = false;
  reticle.visible = false; liveLine.visible = false;
  $('hud').style.display = 'none';
  $('hud2').style.display = 'none';
  ui.style.background = '';
  document.body.style.background = '';
  const s = summary();
  $('resText').textContent = s.text || 'Точек нет.';
  $('json').value = JSON.stringify(s.json, null, 1);
  $('result').style.display = 'block';
  fitPlan();
}

// ---------- план сверху с зумом ----------
const cv = $('plan'), cx = cv.getContext('2d');
let view = { s: 100, ox: 0, oy: 0 };       // px на метр, смещение в px

function planPts() { return pts.map(p => ({ x: p.x * scaleK, y: p.z * scaleK, h: p.y * scaleK })); }

function resizeCanvas() {
  const dpr = devicePixelRatio || 1;
  cv.width = Math.round(cv.clientWidth * dpr);
  cv.height = Math.round(cv.clientHeight * dpr);
}

function fitPlan() {
  resizeCanvas();
  const W = cv.clientWidth, H = cv.clientHeight, P = planPts();
  if (!P.length) { view = { s: 100, ox: W / 2, oy: H / 2 }; drawPlan(); return; }
  const xs = P.map(p => p.x), ys = P.map(p => p.y);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const w = Math.max(maxx - minx, 0.1), h = Math.max(maxy - miny, 0.1);
  const s = Math.min((W - 110) / w, (H - 110) / h);
  view = { s, ox: W / 2 - (minx + maxx) / 2 * s, oy: H / 2 - (miny + maxy) / 2 * s };
  drawPlan();
}

function zoomAt(px, py, k) {
  const ns = Math.min(Math.max(view.s * k, 5), 20000);
  k = ns / view.s;
  view.ox = px - (px - view.ox) * k;
  view.oy = py - (py - view.oy) * k;
  view.s = ns;
}

function label(text, x, y, color) {
  cx.font = '13px system-ui, sans-serif';
  const w = cx.measureText(text).width + 10;
  cx.fillStyle = 'rgba(15,18,23,.85)';
  cx.fillRect(x - w / 2, y - 10, w, 20);
  cx.fillStyle = color || '#eef1f5';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText(text, x, y);
}

function drawPlan() {
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, W, H);
  const X = x => view.ox + x * view.s, Y = y => view.oy + y * view.s;

  // сетка
  const steps = [0.01, 0.05, 0.1, 0.5, 1, 2, 5, 10, 50];
  const g = steps.find(s => s * view.s >= 40) || 50;
  cx.strokeStyle = '#1e2430'; cx.lineWidth = 1; cx.beginPath();
  for (let x = Math.floor(-view.ox / view.s / g) * g; X(x) <= W; x += g) { cx.moveTo(X(x), 0); cx.lineTo(X(x), H); }
  for (let y = Math.floor(-view.oy / view.s / g) * g; Y(y) <= H; y += g) { cx.moveTo(0, Y(y)); cx.lineTo(W, Y(y)); }
  cx.stroke();
  cx.fillStyle = '#5d6877'; cx.font = '12px system-ui'; cx.textAlign = 'left'; cx.textBaseline = 'top';
  cx.fillText('сетка ' + (g >= 1 ? g + ' м' : Math.round(g * 1000) + ' мм'), 8, 8);

  const P = planPts();
  if (!P.length) return;
  if (P.length >= 2) {
    cx.beginPath();
    P.forEach((p, i) => i ? cx.lineTo(X(p.x), Y(p.y)) : cx.moveTo(X(p.x), Y(p.y)));
    if (closed) { cx.closePath(); cx.fillStyle = 'rgba(45,127,249,.18)'; cx.fill(); }
    cx.strokeStyle = '#2d7ff9'; cx.lineWidth = 2.5; cx.stroke();

    // подписи сторон
    const n = closed ? P.length : P.length - 1;
    for (let i = 0; i < n; i++) {
      const a = P[i], b = P[(i + 1) % P.length];
      const d = mode === 'dist' ? Math.hypot(b.x - a.x, b.h - a.h, b.y - a.y) : Math.hypot(b.x - a.x, b.y - a.y);
      let t = d.toFixed(3) + ' м';
      if (mode === 'dist') t += '  Δh ' + Math.abs(b.h - a.h).toFixed(3);
      label(t, X((a.x + b.x) / 2), Y((a.y + b.y) / 2), '#ffd27a');
    }
  }
  P.forEach((p, i) => {
    cx.beginPath(); cx.arc(X(p.x), Y(p.y), 6, 0, 7);
    cx.fillStyle = '#19a974'; cx.fill();
    cx.fillStyle = '#fff'; cx.font = 'bold 12px system-ui'; cx.textAlign = 'left'; cx.textBaseline = 'bottom';
    cx.fillText(String(i + 1), X(p.x) + 8, Y(p.y) - 6);
  });
  if (closed && P.length >= 3) {
    const cxm = P.reduce((s, p) => s + p.x, 0) / P.length, cym = P.reduce((s, p) => s + p.y, 0) / P.length;
    label((polyArea(pts) * scaleK * scaleK).toFixed(2) + ' м²', X(cxm), Y(cym), '#8be3b8');
  }
}

const ptrs = new Map();
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.offsetX, y: e.offsetY }); });
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId), cur = { x: e.offsetX, y: e.offsetY };
  if (ptrs.size === 1) {
    view.ox += cur.x - prev.x; view.oy += cur.y - prev.y;
  } else if (ptrs.size === 2) {
    const other = [...ptrs.entries()].find(([id]) => id !== e.pointerId)[1];
    const d0 = Math.hypot(prev.x - other.x, prev.y - other.y), d1 = Math.hypot(cur.x - other.x, cur.y - other.y);
    const m0 = { x: (prev.x + other.x) / 2, y: (prev.y + other.y) / 2 }, m1 = { x: (cur.x + other.x) / 2, y: (cur.y + other.y) / 2 };
    if (d0 > 0) zoomAt(m0.x, m0.y, d1 / d0);
    view.ox += m1.x - m0.x; view.oy += m1.y - m0.y;
  }
  ptrs.set(e.pointerId, cur); drawPlan();
});
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, e => ptrs.delete(e.pointerId)));
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.offsetX, e.offsetY, e.deltaY < 0 ? 1.15 : 1 / 1.15); drawPlan(); }, { passive: false });
$('zin').onclick = () => { zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1.4); drawPlan(); };
$('zout').onclick = () => { zoomAt(cv.clientWidth / 2, cv.clientHeight / 2, 1 / 1.4); drawPlan(); };
$('zfit').onclick = fitPlan;

// ---------- DXF (мм) ----------
$('dxf').onclick = () => {
  if (!pts.length) return;
  const q = pts.map(p => [Math.round(p.x * scaleK * 1000), Math.round(-p.z * scaleK * 1000), Math.round(p.y * scaleK * 1000)]);
  let s = '0\nSECTION\n2\nENTITIES\n';
  if (mode === 'room' && q.length >= 2) {
    s += '0\nPOLYLINE\n8\n0\n66\n1\n70\n' + (closed ? 1 : 0) + '\n';
    q.forEach(v => { s += '0\nVERTEX\n8\n0\n10\n' + v[0] + '\n20\n' + v[1] + '\n30\n0\n'; });
    s += '0\nSEQEND\n8\n0\n';
  } else if (q.length >= 2) {
    const a = q[q.length - 2], b = q[q.length - 1];
    s += '0\nLINE\n8\n0\n10\n' + a[0] + '\n20\n' + a[1] + '\n30\n' + a[2] + '\n11\n' + b[0] + '\n21\n' + b[1] + '\n31\n' + b[2] + '\n';
  }
  s += '0\nENDSEC\n0\nEOF\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([s], { type: 'application/dxf' }));
  a.download = 'room.dxf';
  a.click();
};

renderer.setAnimationLoop((t, frame) => {
  if (frame && session) {
    const ref = renderer.xr.getReferenceSpace();
    if (!hitRequested) {
      hitRequested = true;
      session.requestReferenceSpace('viewer').then(vs =>
        session.requestHitTestSource({ space: vs }).then(src => { hitSource = src; }));
    }
    if (hitSource) {
      const res = frame.getHitTestResults(hitSource);
      if (res.length) {
        const pose = res[0].getPose(ref);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
        hitPos.setFromMatrixPosition(reticle.matrix);
        updateLive();
      } else {
        reticle.visible = false;
        liveLine.visible = false;
        $('live').textContent = 'Наведи на поверхность';
      }
    }
  }
  renderer.render(scene, camera);
});

// ---------- расчёты ----------
const m = v => v * scaleK;                       // метры с поправкой
const fmt = v => { v = m(v); return v.toFixed(3) + ' м (' + Math.round(v * 1000) + ' мм)'; };
const flat = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

function polyArea(p) {                           // шоелейс по XZ
  let s = 0;
  for (let i = 0; i < p.length; i++) {
    const a = p[i], b = p[(i + 1) % p.length];
    s += a.x * b.z - b.x * a.z;
  }
  return Math.abs(s) / 2;
}

function summary() {
  const lines = [];
  const json = { scale: scaleK, mode, closed, points_mm: pts.map(p => [p.x, p.y, p.z].map(v => Math.round(m(v) * 1000))) };
  if (pts.length >= 2) {
    if (mode === 'dist') {
      const a = pts[pts.length - 2], b = pts[pts.length - 1];
      lines.push('Расстояние 3D: ' + fmt(a.distanceTo(b)));
      lines.push('По горизонтали: ' + fmt(flat(a, b)));
      lines.push('По вертикали: ' + fmt(Math.abs(a.y - b.y)));
      json.distance_mm = Math.round(m(a.distanceTo(b)) * 1000);
    } else {
      const n = closed ? pts.length : pts.length - 1;
      let per = 0;
      for (let i = 0; i < n; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        const d = flat(a, b); per += d;
        lines.push('Стена ' + (i + 1) + ': ' + fmt(d));
      }
      lines.push('Периметр: ' + fmt(per));
      const ys = pts.map(p => p.y);
      lines.push('Разброс высот точек: ' + fmt(Math.max(...ys) - Math.min(...ys)));
      if (closed && pts.length >= 3) {
        const A = polyArea(pts) * scaleK * scaleK;
        lines.push('Площадь: ' + A.toFixed(2) + ' м²');
        json.area_m2 = +A.toFixed(3);
      }
      json.perimeter_mm = Math.round(m(per) * 1000);
    }
  }
  return { text: lines.join('\n'), json };
}

function updateLive() {
  if (!pts.length || (mode === 'dist' && pts.length >= 2) || closed) { liveLine.visible = false; $('live').textContent = pts.length ? 'Готово' : 'Ставь первую точку'; return; }
  const last = pts[pts.length - 1];
  const pa = liveGeom.attributes.position;
  pa.setXYZ(0, last.x, last.y, last.z);
  pa.setXYZ(1, hitPos.x, hitPos.y, hitPos.z);
  pa.needsUpdate = true;
  liveLine.visible = true;
  $('live').textContent = fmt(last.distanceTo(hitPos));
}

function redraw() {
  while (group.children.length) group.remove(group.children[0]);
  if (sel >= pts.length) sel = pts.length - 1;
  pts.forEach((p, i) => {
    const s = new THREE.Mesh(sphereGeom, i === sel ? selMat : sphereMat);
    s.position.copy(p);
    if (i === sel) s.scale.setScalar(1.4);
    group.add(s);
  });
  if (pts.length >= 2) {
    const arr = pts.slice();
    if (closed) arr.push(pts[0]);
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(arr), lineMat));
  }
  $('info').textContent = summary().text;
  update();
}

function update() {
  $('mDist').classList.toggle('active', mode === 'dist');
  $('mRoom').classList.toggle('active', mode === 'room');
  $('close').style.display = mode === 'room' ? '' : 'none';
  if (!pts.length) $('live').textContent = 'Ставь первую точку';
}

// ---------- кнопки ----------
$('go').onclick = start;
$('put').onclick = () => {
  if (!reticle.visible) return;
  if (closed) return;
  if (mode === 'dist' && pts.length >= 2) pts = [];
  pts.push(hitPos.clone());
  sel = pts.length - 1;
  redraw();
};
$('undo').onclick = () => { closed = false; pts.pop(); sel = pts.length - 1; redraw(); };
$('reset').onclick = () => { pts = []; closed = false; sel = -1; redraw(); };

// ---------- подстройка выбранной точки ----------
$('nudge').onclick = () => {
  const p = $('pad');
  p.style.display = p.style.display === 'none' ? 'grid' : 'none';
  $('nudge').classList.toggle('active', p.style.display !== 'none');
};
const STEPS = [10, 1, 50];
$('step').onclick = () => {
  stepMm = STEPS[(STEPS.indexOf(stepMm) + 1) % STEPS.length];
  $('step').textContent = 'шаг ' + stepMm + ' мм';
};
$('prevPt').onclick = () => { if (pts.length) { sel = (sel - 1 + pts.length) % pts.length; redraw(); } };
$('nextPt').onclick = () => { if (pts.length) { sel = (sel + 1) % pts.length; redraw(); } };

const UP = new THREE.Vector3(0, 1, 0);
function nudge(dir) {
  if (sel < 0 || sel >= pts.length) return;
  const f = new THREE.Vector3();
  renderer.xr.getCamera().getWorldDirection(f);
  f.y = 0;
  if (f.lengthSq() < 1e-6) f.set(0, 0, -1);
  f.normalize();
  const r = new THREE.Vector3().crossVectors(f, UP);        // вправо относительно взгляда
  const v = { left: r.clone().negate(), right: r, fwd: f, back: f.clone().negate(), up: UP, down: UP.clone().negate() }[dir];
  pts[sel].addScaledVector(v, stepMm / 1000 / scaleK);
  redraw();
}
document.querySelectorAll('#pad [data-d]').forEach(b => {
  let t1 = null, t2 = null;
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    nudge(b.dataset.d);
    t1 = setTimeout(() => { t2 = setInterval(() => nudge(b.dataset.d), 90); }, 350);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
});
$('close').onclick = () => { if (pts.length >= 3) { closed = true; redraw(); } };
$('mDist').onclick = () => { mode = 'dist'; pts = []; closed = false; redraw(); };
$('mRoom').onclick = () => { mode = 'room'; pts = []; closed = false; redraw(); };
$('exit').onclick = () => session && session.end();
$('again').onclick = start;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
update();
</script>
</body>
</html>
